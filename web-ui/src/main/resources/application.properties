spring.application.name=cln-lang Web UI

# H2 datasource – file-based so data survives restarts during development
spring.datasource.url=jdbc:h2:file:./data/clndb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Use column names exactly as declared in @Column(name=...) — no camelCase→snake_case conversion
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Enable H2 console for inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port
server.port=8080

# Vaadin
vaadin.launch-browser=false
